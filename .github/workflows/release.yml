name: Release

on:
  push:
    tags: ["v*"]

# Write access is needed to create the draft release. Third-party actions are pinned to commit SHAs,
# the checkout token is not kept on disk and npm install scripts are not run (none are needed).
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend install
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Build bridge
        run: cargo build --release -p cuw-bridge

      - name: Build installer and draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          # Adds cuw-bridge.exe and the install/uninstall scripts to the installer (DECISIONS.md D-25).
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "Claude Usage Widget ${{ github.ref_name }}"
          releaseBody: "Unsigned build - see README for the SmartScreen note and install steps."
          releaseDraft: true
          prerelease: false
