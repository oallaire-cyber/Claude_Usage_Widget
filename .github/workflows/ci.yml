name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend install
        working-directory: app
        run: npm ci --ignore-scripts

      # The Tauri crate embeds ../dist at compile time, so the frontend is built before clippy/test.
      - name: Frontend typecheck + build
        working-directory: app
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install-script tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          if (Test-Path tools/tests/Test-InstallBridge.ps1) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/tests/Test-InstallBridge.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
