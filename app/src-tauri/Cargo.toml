[package]
name = "cuw-app"
description = "Claude Usage Widget - Windows tray app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "cuw_app_lib"
# Desktop only: no staticlib/cdylib (those serve Tauri mobile targets), see DECISIONS.md D-24.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
cuw-core.workspace = true
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
